name: trader_calc_app
description: Trader Calc - a luxurious cross-platform trader's calculator.
publish_to: none
# Single source of the version. CI reads it for release names; bump with a tag (vX.Y.Z).
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: any # version is pinned by flutter_localizations
  trader_core:
    path: ../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts: download Vazirmatn (Persian + Latin) and Inter (numbers) into
  # assets/fonts/ (see assets/fonts/README.md), then uncomment:
  #
  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
