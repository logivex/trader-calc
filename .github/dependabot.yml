version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /packages/core
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    open-pull-requests-limit: 5
